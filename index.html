<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bit Blitz — Hex Storm Academy</title>
    <meta name="description" content="8-bit binary, denary and hex educational arcade game for classrooms" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ── Anti-cheat ─────────────────────────────────────────────────────────
      (function () {
        // 0. Preserve native timers before any speed-hack patches setTimeout/setInterval
        var _nativeSetTimeout = window.setTimeout.bind(window);
        var _nativeSetInterval = window.setInterval.bind(window);
        window.__timerIntegrityOk = function () {
          return window.setTimeout === _nativeSetTimeout
            && window.setInterval === _nativeSetInterval;
        };

        // 1. Neuter React DevTools so game state cannot be inspected or edited
        //    via the browser Components panel.
        if (typeof window.__REACT_DEVTOOLS_GLOBAL_HOOK__ === 'object') {
          for (var k in window.__REACT_DEVTOOLS_GLOBAL_HOOK__) {
            try {
              window.__REACT_DEVTOOLS_GLOBAL_HOOK__[k] =
                typeof window.__REACT_DEVTOOLS_GLOBAL_HOOK__[k] === 'function'
                  ? function () {}
                  : null;
            } catch (_) {}
          }
        }

        // 2. Intercept fetch calls to the score API so that calls originating
        //    from the console (outside the React app) are blocked.
        //    The React app sets this flag before every legitimate API call.
        var _fetch = window.fetch.bind(window);
        var _appFetchAllowed = false;
        // Exposed only to the module bundle via a closure — not on window
        window.__allowAppFetch = function (fn) {
          _appFetchAllowed = true;
          try { return fn(); } finally { _appFetchAllowed = false; }
        };
        window.fetch = function (input) {
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          if ((url.indexOf('/api/scores') !== -1 || url.indexOf('/api/seal-score') !== -1)
              && !_appFetchAllowed) {
            console.warn('%c⛔ Bit Blitz Anti-Cheat: API call blocked.',
              'color:#ff2d55;font-weight:bold');
            return Promise.reject(new Error('Blocked by anti-cheat.'));
          }
          return _fetch.apply(this, arguments);
        };

        // 3. Show a deterrent message in the console.
        setTimeout(function () {
          console.log(
            '%c⚠ Bit Blitz — Anti-Cheat Active',
            'color:#ff2d55;font-size:16px;font-weight:bold'
          );
          console.log(
            '%cAll score submissions are cryptographically verified server-side.\n' +
            'Direct API calls are blocked. Cheating is logged.',
            'color:#ff9f43'
          );
        }, 800);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
